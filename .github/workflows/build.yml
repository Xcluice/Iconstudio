name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        run: base64 -d app/release.jks.b64 > app/release.jks

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain -PbuildNum=${{ github.run_number }} 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -80 | sed 's#file:///home/runner/work/Iconstudio/Iconstudio/##' | while IFS= read -r l; do echo "::error::$l"; done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk IconStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IconStudio-release
          path: IconStudio.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Icon Studio build ${{ github.run_number }}
          files: IconStudio.apk
